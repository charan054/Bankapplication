spring.application.name=Bankapplication
server.port=8080

# Optional local file (git-ignored) holding DB_PASSWORD and OTP_API_KEY; see .env.example.
# Real environment variables work too and are what a server should use.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
otp.api-key=${OTP_API_KEY:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer