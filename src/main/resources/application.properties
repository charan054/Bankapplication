spring.application.name=Bankapplication
server.port=8080

# Optional local file (git-ignored) holding DB_PASSWORD; see .env.example.
# Real environment variables work too and are what a server should use.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Admin key: used by bank.html for account-wide operations (view all users, act on any phone/account number).
# Service key: used only by trusted backend services (PhonepayService) calling this app's API. Keep these two
# DIFFERENT values - a leaked browser-facing admin key must not also compromise the service integration.
bank.admin.api-key=${ADMIN_API_KEY}
bank.service.api-key=${SERVICE_API_KEY}
# How long a customer login stays valid
bank.session.ttl-minutes=30
# How long a forgot-PIN email code stays valid
bank.pin-reset.ttl-minutes=10

# Forgot-PIN codes are emailed via Gmail SMTP. MAIL_USERNAME/MAIL_PASSWORD are optional - if unset, mail sending
# just fails quietly (logged, not thrown - see MailService) and the rest of the app works as before.
# MAIL_PASSWORD must be a Gmail App Password (myaccount.google.com/apppasswords), not the account's real password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Falls back to MAIL_USERNAME itself when MAIL_FROM isn't set separately.
bank.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema changes are versioned SQL files in src/main/resources/db/migration (Flyway); Hibernate only checks
# that the entities still match the schema. All services share one MySQL schema, so each keeps its own
# history table. Baseline-version 0 + an IF NOT EXISTS V1 lets an existing database (built earlier by
# ddl-auto=update) adopt Flyway without a manual step.
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_bank
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Self-signup confirmed by an emailed code (see SignupService): how long the code stays valid.
bank.signup.ttl-minutes=10
# LOCAL DEVELOPMENT ONLY: when the signup email can't be sent (no MAIL_* credentials), write the code to the log so a
# signup can still be finished. Never enable where real customers sign up.
bank.signup.log-codes-when-mail-fails=${SIGNUP_LOG_CODES:false}

# Large self-service withdrawals need an emailed code (see WithdrawalOtpService): from this amount up; 0 turns it off.
bank.withdraw-otp.threshold=${WITHDRAW_OTP_THRESHOLD:10000}
bank.withdraw-otp.ttl-minutes=5
# LOCAL DEVELOPMENT ONLY: log the code when the email cannot be sent. Never enable where real customers withdraw.
bank.withdraw-otp.log-codes-when-mail-fails=${WITHDRAW_OTP_LOG_CODES:false}

# Behind the ApiGateway every request arrives from the gateway's address. "native" lets Tomcat take the real client address
# from X-Forwarded-For, but only from a trusted (private/loopback) proxy, so an outside caller cannot spoof it. The per-address
# rate limits use request.getRemoteAddr(); without this every customer shares one bucket. FORWARD_HEADERS_STRATEGY=none turns it off.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Daily cap on money leaving an account (see DailyLimitService): the default, the highest a customer may choose, and how
# long a RAISE waits before it applies (lowering is immediate).
bank.daily-limit.default=${DAILY_LIMIT_DEFAULT:100000}
bank.daily-limit.max=${DAILY_LIMIT_MAX:1000000}
bank.daily-limit.raise-delay-hours=${DAILY_LIMIT_RAISE_DELAY_HOURS:24}
