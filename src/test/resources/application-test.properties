# Overlays src/main/resources/application.properties when the "test" profile is active.
# Points the app at an in-memory H2 database so tests never touch the real MySQL "charan" schema.
spring.datasource.url=jdbc:h2:mem:banktest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Don't try to connect to a Kafka broker when the Spring context starts.
spring.kafka.listener.auto-startup=false

# Fixed, obviously-fake values so tests never depend on ADMIN_API_KEY/SERVICE_API_KEY being set on the machine.
bank.admin.api-key=test-admin-key
bank.service.api-key=test-service-key
